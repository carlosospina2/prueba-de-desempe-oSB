services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpflow
      POSTGRES_USER: helpflow
      POSTGRES_PASSWORD: helpflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  technician-dispatch-service:
    build: ./technician-dispatch-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  support-ticket-service:
    build: ./support-ticket-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/helpflow
      DATABASE_USER: helpflow
      DATABASE_PASSWORD: helpflow_dev
      JWT_SECRET: ${JWT_SECRET:-helpflow-secret-key-minimum-32-characters-here}
      DISPATCH_URL: http://technician-dispatch-service:8081
    depends_on:
      db:
        condition: service_healthy
      technician-dispatch-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  postgres_data:
